spring.application.name=GestionDeCommunaute

server.port=8080

# Configuration de la base de données
spring.datasource.url=jdbc:mysql://localhost:3307/gestion_communaute_newdb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=BIL5002wiz@
server.address=0.0.0.0

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Pour la documentation Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Pour résoudre les problèmes de cache
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# Pour l'upload de fichiers
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Regroupement des signalements par dossier
# Rayon en metres : un nouveau signalement situe a moins de cette distance de l'ancre
# d'un dossier ouvert reprend son code (SIG-xxxx) au lieu d'en creer un nouveau.
application.signalement.rayon-regroupement=40

# Configuration JWT
application.security.jwt.secret-key=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
application.security.jwt.expiration=3600000
application.security.jwt.refresh-token.expiration=86400000
